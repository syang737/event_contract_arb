[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-contract-arb"
version = "0.1.0"
description = "Paper-trading arbitrage engine between Polymarket (CLOB) and Kalshi event contracts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "httpx[socks]>=0.27",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
]

[project.scripts]
arb-engine = "arb_engine.cli:cli"

[tool.setuptools.packages.find]
include = ["arb_engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
